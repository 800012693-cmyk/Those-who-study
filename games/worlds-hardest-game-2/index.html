    <style type="text/css">
      .no-select {
        -webkit-touch-callout: none; /* iOS Safari */
        -webkit-user-select: none; /* Safari */
        -khtml-user-select: none; /* Konqueror HTML */
        -moz-user-select: none; /* Old versions of Firefox */
        -ms-user-select: none; /* Internet Explorer/Edge */
        user-select: none; /* Non-prefixed version, currently supported by Chrome, Edge, Opera and Firefox */
      }
    </style>

    <script type="text/javascript">
      setTimeout(function () {
        if (document.getElementsByTagName("canvas").length) {
          document.getElementsByTagName("body")[0].classList.add("no-select");
        }
      }, 2000);
    </script>
    <style>
      body { display:grid; place-items:center; overflow:hidden; background:#000; }
      canvas { position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%); }
      html, body { width:100%; height:100%; height:100vh; margin:0; padding:0; }
      #fsBtn {
        position: fixed; right: 10px; bottom: 10px; z-index: 1000; opacity: .35;
        background: rgba(0,0,0,.6); color: #fff; border: 1px solid rgba(255,255,255,.4);
        border-radius: 6px; padding: 6px 10px; font: 12px system-ui, sans-serif; cursor: pointer;
      }
      #fsBtn:hover { opacity: 1; }
    </style>
    <script>
      function toggleFullscreen() {
        if (document.fullscreenElement) { document.exitFullscreen(); }
        else if (document.documentElement.requestFullscreen) { document.documentElement.requestFullscreen(); }
      }
    </script>
</head>

  <body>
    <div>
      <script language="javascript" src="js/main.js" type="text/javascript"></script>
    </div>

    
      <button id="fsBtn" onclick="toggleFullscreen()">&#9974; Fullscreen</button>
