<!DOCTYPE html>
<html lang="en-us">

<head>
  <base href="./">
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">

  <title>Drive Mad</title>
  <meta name="description" content="">
  <meta name="google" content="notranslate">

  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <script>
  /* PokiSDK no-op stub: the Poki ad SDK is intentionally not included on this host. */
  window.PokiSDK = window.PokiSDK || {
    init: function () { return Promise.resolve(); },
    gameLoadingStart: function () { return Promise.resolve(); },
    gameLoadingFinished: function () { return Promise.resolve(); },
    gameInteractive: function () { return Promise.resolve(); },
    gameplayStart: function () { return Promise.resolve(); },
    gameplayStop: function () { return Promise.resolve(); },
    commercialBreak: function () { return Promise.resolve(); },
    rewardedBreak: function () { return Promise.resolve(false); },
    happyTime: function () {},
    customEvent: function () {},
    destroy: function () { return Promise.resolve(); }
  };
</script>
<link rel="stylesheet" href="./webapp/fancade.css">
  <link rel="icon" href="./webapp/cover.jpg">
<style id="siteFs">
  #fsBtn {
    position: fixed; right: 10px; bottom: 10px; z-index: 99999; opacity: .35;
    background: rgba(0,0,0,.6); color: #fff; border: 1px solid rgba(255,255,255,.4);
    border-radius: 6px; padding: 6px 10px; font: 12px system-ui, sans-serif; cursor: pointer;
  }
  #fsBtn:hover { opacity: 1; }
</style>
<script>
  function toggleFullscreen() {
    if (document.fullscreenElement) { document.exitFullscreen(); }
    else if (document.documentElement.requestFullscreen) { document.documentElement.requestFullscreen(); }
  }
</script>
</head>

<body id="body">

  <!-- Modal dialog div -->
  <div id="modal_parent">
    <div id="modal_content">
      <span id="modal_close_button">&times;</span>
      <div id="store_link_modal_content" class="modal_inner"></div>
      <div id="share_file_modal_content" class="modal_inner"></div>
    </div>
  </div>

  <!-- 
      Game canvas and overlay. Emscripten makes some assumptions about how the canvas is positioned in order
      to translate document to game coordinates
    -->
  <div id="canvas_border" class="emscripten_border">
    <div id="play_content" class="middle center">
      <div class="edge">
        <div class="box">
          <div class="black">
            <img src="./webapp/cover.jpg" class="cover">
            <p class="title">Drive Mad</p>
            <p class="author">Fancade</p>
          </div>
        </div>
      </div>
      <div id="progress_or_play">
        <progress id="progress" class="loading" value="0" max="100"></progress>
      </div>
      <p class="description"></p>
    </div>
    <canvas class="emscripten" id="canvas" tabindex=-1>
    </canvas>
    <div id="gradient"></div>
    <div id="webview_content"></div>
  </div>

  <!-- Manual JS, Called from WASM -->
  <script type="text/javascript" src="./webapp/source_min.js"></script>

  <!-- Auto generated JS -->
  <script type="text/javascript" src="./webapp/index.js"></script>
  <button id="fsBtn" onclick="toggleFullscreen()">&#9974; Fullscreen</button>
</body>

</html>
