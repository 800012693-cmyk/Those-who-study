<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval' 'wasm-unsafe-eval' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self' blob: data:; worker-src 'self' blob:; font-src 'self' data:; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>Getaway Shootout</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #231f20; }
  #unity-canvas { width: 100vw; height: 100vh; display: block; }
  #fsBtn { position: fixed; right: 10px; bottom: 10px; z-index: 99999; opacity: .35;
           background: rgba(0,0,0,.6); color: #fff; border: 1px solid rgba(255,255,255,.4);
           border-radius: 6px; padding: 6px 10px; font: 12px system-ui, sans-serif; cursor: pointer; }
  #fsBtn:hover { opacity: 1; }
  #ai { position: fixed; left: 0; right: 0; top: 50%; transform: translateY(-50%); text-align: center;
        color: #fff; font: 14px system-ui, sans-serif; opacity: .8; pointer-events: none; }
</style>
<script>
/* No-op CrazyGames SDK stub: the build embeds the official CrazySDK and calls it for ads/user data.
   Without the portal script this keeps every SDK call harmless so the game boots anywhere. */
window.CrazyGames = {
  SDK: {
    init: function(){ return Promise.resolve(); },
    gameplayStart: function(){}, gameplayStop: function(){},
    ad: { requestAd: function(){ return Promise.reject(new Error('ads-unavailable')); } },
    banner: function(type, cb){ try { (cb||function(){})("finished"); } catch(e){} },
    rewardedBanner: function(cb){ try { (cb||function(){})("finished"); } catch(e){} },
    user: { getUser: function(){ return Promise.resolve(null); },
            getToken: function(){ return Promise.resolve(null); },
            getUserAndToken: function(){ return Promise.resolve(null); } },
    data: { clearAllItems: function(){}, deleteItem: function(k){ try{ localStorage.removeItem(k); }catch(e){} },
            getItem: function(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
            setItem: function(k, v){ try{ localStorage.setItem(k, v); }catch(e){} } },
    environment: { getEnvironment: function(){ return Promise.resolve('local'); } },
    game: { sdkGameLoadingStart: function(){}, sdkGameLoadingStop: function(){} },
    hasAllTranslationCached: function(){ return Promise.resolve(true); }
  }
};
function toggleFullscreen() {
  if (document.fullscreenElement) { document.exitFullscreen(); }
  else if (document.documentElement.requestFullscreen) { document.documentElement.requestFullscreen(); }
}
</script>
<script src="Build/GS_Crazygames_v1.2.3.loader.js"></script>
<script>
const B = "Build/";
createUnityInstance(document.querySelector("#unity-canvas"), {
  dataUrl: B + "864872d3e8c17c58e54028c101dae7a5.data",
  frameworkUrl: B + "dbc6f14bf976310a49dda5b1237392f2.js",
  codeUrl: B + "c0f8b2f06ae4c7c89b1e883b3d07ca8f.wasm",
  streamingAssetsUrl: "StreamingAssets",
  companyName: "New Eich Games",
  productName: "Getaway Shootout",
  productVersion: "1.2.3",
}, function(p) {
  document.getElementById("ai").textContent = "Loading " + Math.round(p * 100) + "%";
});
</script>
</head>
<body>
<canvas id="unity-canvas" width="960" height="540"></canvas>
<button id="fsBtn" onclick="toggleFullscreen()">⛶ Fullscreen</button>
<div id="ai">Loading…</div>
</body>
</html>
