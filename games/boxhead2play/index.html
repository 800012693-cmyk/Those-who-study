<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Boxhead 2Play</title>
  <link rel="icon" type="image/x-icon" href="boxhead2play.jpg">
  <style>
    html, body { margin:0; height:100%; background:#000; }
    #ruffle { width:100%; height:100%; }
    #fsBtn { position:fixed; right:10px; bottom:10px; z-index:99999; opacity:.35;
             background:rgba(0,0,0,.6); color:#fff; border:1px solid rgba(255,255,255,.4);
             border-radius:6px; padding:6px 10px; font:12px system-ui,sans-serif; cursor:pointer; }
    #fsBtn:hover { opacity:1; }
  </style>
  <script>
    function toggleFullscreen() {
      if (document.fullscreenElement) { document.exitFullscreen(); }
      else if (document.documentElement.requestFullscreen) { document.documentElement.requestFullscreen(); }
    }
  </script>
</head>
<body>
  <div id="ruffle"></div>
  <button id="fsBtn" onclick="toggleFullscreen()">⛶ Fullscreen</button>
  <script src="ruffle.js"></script>
  <script>
    window.RufflePlayer = window.RufflePlayer || {};
    window.addEventListener("load", () => {
      const ruffle = window.RufflePlayer.newest();
      const player = ruffle.createPlayer();
      player.style.width = "100%";
      player.style.height = "100%";
      document.getElementById("ruffle").appendChild(player);
      player.load("BoxHead2play.swf");
    });
  </script>
</body>
</html>
