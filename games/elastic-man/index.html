<!DOCTYPE html>
<html>
  <head>
    <style>
      #fsBtn {
        position: fixed; right: 10px; bottom: 10px; z-index: 99999; opacity: .35;
        background: rgba(0,0,0,.6); color: #fff; border: 1px solid rgba(255,255,255,.4);
        border-radius: 6px; padding: 6px 10px; font: 12px system-ui, sans-serif; cursor: pointer;
      }
      #fsBtn:hover { opacity: 1; }
    </style>
    <script>
      function toggleFullscreen() {
        if (document.fullscreenElement) { document.exitFullscreen(); }
        else if (document.documentElement.requestFullscreen) { document.documentElement.requestFullscreen(); }
      }
    </script>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1" />
    <title>Elastic Man | OutRed</title>
    <link rel="stylesheet" href="face.css" type="text/css" />
  </head>
  <body>
    <script type="text/template" id="loading-template">
      <div id="loading-bar" class="loading-bar-visible">
                      <div id="loading-fill"></div>
                  </div>
    </script>
    <script type="text/template" id="no-support-template">
      <div id="error">Your browser does not support the required features. Try another browser and/or device!</div>
    </script>
    <script type="text/template" id="main-template">
      <div id="quality-container">
                      <div id="quality-label">Quality</div>
                      <div class="quality" id="quality-medium">Medium</div>
                      <div class="quality" id="quality-high">High</div>
                  </div>

                  <div id="credits"></script>
    <div id="placeholder"></div>
    <script src="2face.js"></script>
  <button id="fsBtn" onclick="toggleFullscreen()">⛶ Fullscreen</button>
</body>
</html>
