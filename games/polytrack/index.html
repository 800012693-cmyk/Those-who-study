<!DOCTYPE html>

<html>
	<head>
    <title>PolyTrack</title>
    <style>
      html, body { width:100%; height:100%; height:100vh; margin:0; padding:0; background:#28346a; }
      #screen { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
      #fsBtn {
        position: fixed; right: 10px; bottom: 10px; z-index: 1000; opacity: .35;
        background: rgba(0,0,0,.6); color: #fff; border: 1px solid rgba(255,255,255,.4);
        border-radius: 6px; padding: 6px 10px; font: 12px system-ui, sans-serif; cursor: pointer;
      }
      #fsBtn:hover { opacity: 1; }
    </style>
    <script>
      function toggleFullscreen() {
        if (document.fullscreenElement) { document.exitFullscreen(); }
        else if (document.documentElement.requestFullscreen) { document.documentElement.requestFullscreen(); }
      }
    </script>
		<link rel="manifest" href="manifest.json" />
		<meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1, user-scalable=no">
	</head>
	<body>
		<canvas id="screen"></canvas>
		<div id="ui"></div>
		<div id="transition-layer"></div>

		<script type="module" src="main.bundle.js" defer></script>
	    <button id="fsBtn" onclick="toggleFullscreen()">⛶ Fullscreen</button>
</body>
</html>
