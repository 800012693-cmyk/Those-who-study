<!DOCTYPE html>
<html>
  <head>
    <style>
      #fsBtn {
        position: fixed; right: 10px; bottom: 10px; z-index: 99999; opacity: .35;
        background: rgba(0,0,0,.6); color: #fff; border: 1px solid rgba(255,255,255,.4);
        border-radius: 6px; padding: 6px 10px; font: 12px system-ui, sans-serif; cursor: pointer;
      }
      #fsBtn:hover { opacity: 1; }
    </style>
    <script>
      function toggleFullscreen() {
        if (document.fullscreenElement) { document.exitFullscreen(); }
        else if (document.documentElement.requestFullscreen) { document.documentElement.requestFullscreen(); }
      }
    </script>
    <meta charset="utf-8" />
    <title>Stickman Hook</title>
    <link rel="icon" href="/favicon.ico">
    <link rel="shortcut icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" />
    <style>
      html,
      body {
        position: absolute;
        top: 0px;
        left: 0px;
        margin: 0;
        padding: 0;
        border: 0;
        overflow: hidden;
        width: 100vw;
        height: 100vh;
        background-color: black;
      }
      canvas {
        width: 100%;
      }
    </style>
    <script src="poki3.js"></script>
  </head>
  <body>
    <script src="bundle.js"></script>
  <button id="fsBtn" onclick="toggleFullscreen()">⛶ Fullscreen</button>
</body>
</html>
