<script>/* ===== V23: PLAYER PROFILES - EVERY PLAYER GETS A SEPARATE SAVE ===== */
(()=>{
let LS;try{LS=window.localStorage;LS.length}catch(e){return}
const SP=Storage.prototype,RG=SP.getItem,RS=SP.setItem,RR=SP.removeItem;
const raw={g:k=>{try{return RG.call(LS,k)}catch(e){return null}},s:(k,v)=>{try{RS.call(LS,k,v);return true}catch(e){return false}},r:k=>{try{RR.call(LS,k)}catch(e){}}};
const MK='pjmeta:profiles',pre=id=>'pjp:'+id+':';
const uid=()=>Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-4);
const ours=k=>typeof k=='string'&&/^pj/.test(k)&&!/^(pjp:|pjmeta:)/.test(k);
let meta={list:[],active:null};
try{const m=JSON.parse(raw.g(MK)||'null');if(m&&Array.isArray(m.list))meta=m}catch(e){}
const save=()=>raw.s(MK,JSON.stringify(meta));
const keysOf=id=>{const p=pre(id),o=[];try{for(let i=0;i<LS.length;i++){const k=LS.key(i);if(k&&k.startsWith(p))o.push(k)}}catch(e){}return o};
const wipe=id=>keysOf(id).forEach(raw.r);
/* first launch: copy any old shared save into its own profile (originals left untouched) */
if(!meta.list.length&&!raw.g('pjmeta:migrated')){
  const ks=[];try{for(let i=0;i<LS.length;i++){const k=LS.key(i);if(ours(k))ks.push(k)}}catch(e){}
  if(ks.length){const id=uid();ks.forEach(k=>raw.s(pre(id)+k,raw.g(k)));meta.list.push({id,name:'OLD SAVE',created:Date.now(),last:Date.now()})}
  raw.s('pjmeta:migrated','1');save();
}
let cur=meta.list.find(p=>p.id===meta.active)||null;
const P=()=>pre(cur?cur.id:'_tmp');
/* every game save now lands inside the active player's own namespace */
SP.getItem=function(k){return this===LS&&ours(k)?RG.call(this,P()+k):RG.call(this,k)};
SP.setItem=function(k,v){return this===LS&&ours(k)?RS.call(this,P()+k,v):RS.call(this,k,v)};
SP.removeItem=function(k){return this===LS&&ours(k)?RR.call(this,P()+k):RR.call(this,k)};
if(cur)wipe('_tmp');

const uname=n=>{n=(n||'').toUpperCase().replace(/[^A-Z0-9 _-]/g,'').trim().slice(0,14)||'PLAYER';const b=n;let i=2;while(meta.list.some(p=>p.name===n))n=b.slice(0,12)+' '+i++;return n};
const sum=id=>{try{const g=JSON.parse(raw.g(pre(id)+'pj_run_v1')||'null');if(g&&g.day)return 'DAY '+g.day+' / $'+Math.round(g.m||0).toLocaleString()}catch(e){}return 'NO RUN YET'};
const ago=t=>{const s=(Date.now()-t)/1000;return s<90?'JUST NOW':s<5400?Math.round(s/60)+' MIN AGO':s<129600?Math.round(s/3600)+' HR AGO':Math.round(s/86400)+' DAYS AGO'};
const play=id=>{wipe('_tmp');meta.active=id;const p=meta.list.find(x=>x.id===id);if(p)p.last=Date.now();save();location.reload()};
const create=n=>{const id=uid();meta.list.push({id,name:uname(n),created:Date.now(),last:Date.now()});save();play(id)};
const del=id=>{wipe(id);meta.list=meta.list.filter(p=>p.id!==id);const was=cur&&cur.id===id;if(meta.active===id)meta.active=null;save();if(was)location.reload()};
const exp=id=>{const p=meta.list.find(x=>x.id===id),pf=pre(id),d={};keysOf(id).forEach(k=>d[k.slice(pf.length)]=raw.g(k));return 'PJ1:'+btoa(unescape(encodeURIComponent(JSON.stringify({n:p.name,d}))))};
const imp=code=>{try{code=(code||'').trim();if(code.slice(0,4)!=='PJ1:')return{err:'NOT A VALID SAVE CODE'};const o=JSON.parse(decodeURIComponent(escape(atob(code.slice(4)))));if(!o||typeof o.d!='object')return{err:'NOT A VALID SAVE CODE'};const id=uid();let n=0;for(const k in o.d)if(typeof o.d[k]=='string'&&o.d[k].length<2e6&&ours(k)){raw.s(pre(id)+k,o.d[k]);n++}if(!n){wipe(id);return{err:'SAVE CODE IS EMPTY'}}meta.list.push({id,name:uname(o.n||'IMPORTED'),created:Date.now(),last:Date.now()});save();return{id}}catch(e){return{err:'NOT A VALID SAVE CODE'}}};
const touch=()=>{if(!cur)return;try{const m=JSON.parse(raw.g(MK));const p=m.list.find(x=>x.id===cur.id);if(p){p.last=Date.now();raw.s(MK,JSON.stringify(m))}}catch(e){}};

/* ---------- UI ---------- */
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const st=el('style');st.textContent=`
#pjchip{position:fixed;top:calc(env(safe-area-inset-top,0px) + 6px);right:8px;z-index:9000;font:bold 11px "Courier New",monospace;color:#f2e3b3;background:rgba(10,4,6,.7);border:1px solid #d9a441;padding:3px 7px;cursor:pointer;opacity:.45;letter-spacing:1px}
#pjchip:hover{opacity:1}
#pjov{position:fixed;inset:0;z-index:99999;background:rgba(10,4,6,.97);color:#f2e3b3;font:bold 13px "Courier New",monospace;display:flex;align-items:flex-start;justify-content:center;overflow:auto;box-sizing:border-box;padding:calc(env(safe-area-inset-top,0px) + 18px) 14px calc(env(safe-area-inset-bottom,0px) + 18px)}
#pjov .bx{width:min(460px,100%);border:2px solid #d9a441;background:#2b1a14;padding:16px;box-shadow:0 0 0 4px #0a0406,0 0 0 6px #b8141c}
#pjov .h{font-size:22px;color:#d9a441;letter-spacing:2px;text-shadow:2px 2px 0 #b8141c}
#pjov .sm{font-size:11px;color:#a8946a;margin:4px 0 10px;line-height:1.4}
#pjov .card{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;border:2px solid #5a3a22;background:#1a0d0a;padding:8px;margin:6px 0}
#pjov .card.on{border-color:#d9a441}
#pjov .nm{font-size:15px}#pjov .card .sm{margin:2px 0 0}
#pjov .act{display:flex;gap:5px;flex-wrap:wrap}
#pjov .b{font:inherit;font-size:11px;color:#f2e3b3;background:#8f1218;border:2px solid #d9a441;padding:5px 8px;cursor:pointer}
#pjov .b:hover{background:#b8141c}#pjov .b.g{background:#3a2418}#pjov .b.g:hover{background:#5a3a22}
#pjov .row{display:flex;gap:6px;margin-top:10px}
#pjov .inp,#pjov .ta{font:inherit;font-size:13px;color:#f2e3b3;background:#0a0406;border:2px solid #5a3a22;padding:6px;flex:1;min-width:0;box-sizing:border-box}
#pjov .ta{width:100%;height:64px;resize:none;font-size:10px}
#pjov hr{border:0;border-top:2px dashed #5a3a22;margin:14px 0 8px}`;
document.head.appendChild(st);
let ov=null;
const close=()=>{if(ov){ov.remove();ov=null}};
const open=()=>{
  close();ov=el('div');ov.id='pjov';
  ['mousedown','mouseup','mousemove','click','pointerdown','pointerup','pointermove','touchstart','touchmove','touchend','wheel','contextmenu'].forEach(t=>ov.addEventListener(t,e=>e.stopPropagation(),{passive:true}));
  const bx=el('div','bx');ov.appendChild(bx);
  const bn=(t,f,c)=>{const b=el('button','b'+(c?' '+c:''),t);b.onclick=f;return b};
  bx.appendChild(el('div','h',"WHO'S PLAYING?"));
  bx.appendChild(el('div','sm','EVERY PLAYER GETS THEIR OWN SEPARATE SAVE ON THIS DEVICE.'+(cur?' SWITCHING RELOADS THE GAME.':'')));
  if(!meta.list.length)bx.appendChild(el('div','sm','NO PLAYERS YET. CREATE ONE BELOW.'));
  const out=el('div','sm');
  meta.list.slice().sort((a,b)=>b.last-a.last).forEach(p=>{
    const on=cur&&cur.id===p.id,c=el('div','card'+(on?' on':'')),inf=el('div'),act=el('div','act');
    inf.appendChild(el('div','nm',p.name+(on?'  (ACTIVE)':'')));inf.appendChild(el('div','sm',sum(p.id)+'  /  '+ago(p.last)));
    act.appendChild(bn(on?'RESUME':'PLAY',()=>on?close():play(p.id)));
    act.appendChild(bn('EXPORT',()=>{ta.value=exp(p.id);ta.style.display='block';ta.select();out.textContent='SAVE CODE FOR '+p.name+'. COPY IT TO MOVE THIS SAVE TO ANOTHER DEVICE.'},'g'));
    let armed=0;const d=bn('DELETE',()=>{if(!armed){armed=1;d.textContent='SURE?';setTimeout(()=>{armed=0;d.textContent='DELETE'},3000)}else{del(p.id);open()}},'g');act.appendChild(d);
    c.appendChild(inf);c.appendChild(act);bx.appendChild(c)});
  const row=el('div','row'),inp=el('input','inp');inp.maxLength=14;inp.placeholder='NEW PLAYER NAME';inp.autocomplete='off';
  const mk=()=>create(inp.value);inp.addEventListener('keydown',e=>{if(e.key==='Enter')mk()});
  row.appendChild(inp);row.appendChild(bn('CREATE',mk));bx.appendChild(row);
  bx.appendChild(el('hr'));
  bx.appendChild(el('div','sm','MOVE A SAVE: EXPORT GIVES A CODE, PASTE A CODE HERE TO IMPORT IT AS A NEW PLAYER.'));
  const ta=el('textarea','ta');ta.placeholder='PASTE SAVE CODE HERE (PJ1:...)';ta.spellcheck=false;bx.appendChild(ta);
  const r2=el('div','row');
  r2.appendChild(bn('IMPORT',()=>{const r=imp(ta.value);if(r.err){out.textContent=r.err;return}play(r.id)},'g'));
  r2.appendChild(bn('COPY CODE',()=>{ta.select();try{(navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(ta.value):Promise.reject()).catch(()=>document.execCommand('copy'))}catch(e){try{document.execCommand('copy')}catch(e2){}}out.textContent='COPIED.'},'g'));
  if(cur)r2.appendChild(bn('CLOSE',close,'g'));
  bx.appendChild(r2);bx.appendChild(out);
  document.body.appendChild(ov);if(!cur)inp.focus();
};
/* while the profile screen is open the game must not see the keyboard */
['keydown','keyup','keypress'].forEach(t=>addEventListener(t,e=>{if(ov&&ov.isConnected){e.stopImmediatePropagation();if(t==='keydown'&&e.key==='Escape'&&cur)close()}},true));
const chip=el('div');chip.id='pjchip';chip.textContent='PLAYER: '+(cur?cur.name:'?');chip.title='Switch player / manage saves';
['mousedown','mouseup','click','pointerdown','pointerup','touchstart','touchend'].forEach(t=>chip.addEventListener(t,e=>e.stopPropagation(),{passive:true}));
chip.onclick=open;document.body.appendChild(chip);
if(!cur)open();
touch();setInterval(touch,30000);addEventListener('visibilitychange',touch);addEventListener('pagehide',touch);
window.PJPROFILE={open,name:()=>cur&&cur.name};
})();
</script>

const PJPOS=[[44,62,4],[112,58,4],[180,60,4],[248,62,4],[78,108,4],[148,104,4],[218,110,4],[282,98,4],[50,152,4],[168,150,5]];
const PJH={t:0,lt:0,hz:[],ping:0},PJD={o:0,a:0,v:0};

function pjDockR(i){const p=Math.max(0,Math.min(1,PJD.a*1.4-i*.08)),e=1-Math.pow(1-p,3),tx0=206+Math.round(12*Math.sin(Math.PI*(i+1)/7)),ty=166-i*15;return[Math.round(250+(tx0-250)*e),Math.round(190+(ty-190)*e),92,13]}

  const save=()=>{try{localStorage.setItem(META_KEY,JSON.stringify(PM))}catch(e){}};

  /* Permanent upgrades are intentionally small: they improve runs without deleting the casino's risk. */
  function applyUpgrades(){
    if(!G.up)G.up={};

    if(PM.up.heart>0)G.up.cchm=true;

  const oldOpenShop=openShop;

  fin=function(){

    const rich=G.m>=15000;
    const thief=G.heist;
    const cursed=(G.curse||0)>=3;
    let id='escape';
    if(clean&&rich){id='housebreaker';}
    else if(thief&&clean){id='ghost';}

        scare=.12;shake+=4;

    }}
    if(G.phase==='idle'&&G.streak>=5)ach('hot-hand',20);
  };

  /* Richer VFX layered over the existing renderer. */
  const oldDraw=draw;
  let flash2=0, chroma=0, pulse=0;

    oldDraw();
