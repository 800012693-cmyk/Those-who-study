<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>Unity WebGL Player | Backrooms</title>
  <link rel="shortcut icon" href="TemplateData/favicon.ico">
  <link rel="stylesheet" href="TemplateData/style.css">
  <script src="TemplateData/UnityProgress.js"></script>  
  <script src="Build/UnityLoader.js"></script>
  <script>
    var gameInstance = UnityLoader.instantiate("gameContainer", "Build/Backrooms v1.5 - WebGL.json", {onProgress: UnityProgress});
  </script>
  
  #fsBtn { position:fixed; right:10px; bottom:10px; z-index:99999; opacity:.35;
           background:rgba(0,0,0,.6); color:#fff; border:1px solid rgba(255,255,255,.4);
           border-radius:6px; padding:6px 10px; font:12px system-ui,sans-serif; cursor:pointer; }
  #fsBtn:hover { opacity:1; }
</style>
<script>
  function toggleFullscreen() {
    if (document.fullscreenElement) { document.exitFullscreen(); }
    else if (document.documentElement.requestFullscreen) { document.documentElement.requestFullscreen(); }
  }
</script>
</head>
  <body>
    <div class="webgl-content">
      <div id="gameContainer"></div>
  <button id="fsBtn" onclick="toggleFullscreen()">⛶ Fullscreen</button>
</body>
</html>
