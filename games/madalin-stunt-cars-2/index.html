<!DOCTYPE html>
<html>
  <head>
    <title>Madalin Stunt Cars 2</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="title" content="Madalin Stunt Cars 2" />
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" type="image/x-icon" href="img/logo.jpg" />
    <script src="js/UnityLoader.js"></script>
    <script>
      var gameInstance = UnityLoader.instantiate("gameContainer", "game.json");
      alert("Make sure you give this game time to load, it takes some time. If it takes more than 5 minutes, refresh the page!");
    </script>
  </head>
  <body style="margin: 0; overflow: hidden;">
    <div class="webgl-content" style="width: 100%; height: 100%; overflow: hidden;">
      <div id="gameContainer" style="width: 100%; height: 100%; overflow: hidden;"></div>
    </div>
  <style>#fsBtn{position:fixed;right:10px;bottom:10px;z-index:99999;opacity:.35;background:rgba(0,0,0,.6);color:#fff;border:1px solid rgba(255,255,255,.4);border-radius:6px;padding:6px 10px;font:12px system-ui,sans-serif;cursor:pointer}#fsBtn:hover{opacity:1}</style>
<script>
  function toggleFullscreen() {
    if (document.fullscreenElement) { document.exitFullscreen(); }
    else if (document.documentElement.requestFullscreen) { document.documentElement.requestFullscreen(); }
  }
</script>
<button id="fsBtn" onclick="toggleFullscreen()">⛶ Fullscreen</button>
</body>
</html>
