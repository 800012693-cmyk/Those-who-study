<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kitten Cannon</title>
    <link rel="icon" type="image/x-icon" href="kittencannon.png" />
    <link rel="shortcut icon" type="image/x-icon" href="kittencannon.png" />
  </head>
  <body>
<div id="ruffle" width="100%" height="100%"></div>
    <script src="../_ruffle-legacy/ruffle.js"></script>
    <script>
      window.RufflePlayer = window.RufflePlayer || {};
      window.addEventListener("load", (event) => {
        const ruffle = window.RufflePlayer.newest();
        const player = ruffle.createPlayer();
        const container = document.getElementById("ruffle");
        player.id = "player";
        player.style.width = "100%";
        player.style.height = "100%";
        container.appendChild(player);
        player.load("KittenCannon.swf");
      });
    </script>
  <style>#fsBtn{position:fixed;right:10px;bottom:10px;z-index:99999;opacity:.35;background:rgba(0,0,0,.6);color:#fff;border:1px solid rgba(255,255,255,.4);border-radius:6px;padding:6px 10px;font:12px system-ui,sans-serif;cursor:pointer}#fsBtn:hover{opacity:1}</style>
<script>
  function toggleFullscreen() {
    if (document.fullscreenElement) { document.exitFullscreen(); }
    else if (document.documentElement.requestFullscreen) { document.documentElement.requestFullscreen(); }
  }
</script>
<button id="fsBtn" onclick="toggleFullscreen()">⛶ Fullscreen</button>
</body>
</html>
