<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <title>Cluster Rush</title>
    <link rel="icon" href="./icon.jpg">
    <style>
      /* a style sheet needs to be present for cursor hiding and custom cursors to work. */
    </style>
          body { background:#000; }
      canvas.emscripten { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: contain; background:#000; }
    <style>
      html, body { width:100%; height:100%; height:100vh; margin:0; padding:0; }
      #fsBtn {
        position: fixed; right: 10px; bottom: 10px; z-index: 1000; opacity: .35;
        background: rgba(0,0,0,.6); color: #fff; border: 1px solid rgba(255,255,255,.4);
        border-radius: 6px; padding: 6px 10px; font: 12px system-ui, sans-serif; cursor: pointer;
      }
      #fsBtn:hover { opacity: 1; }
    </style>
    <script>
      function toggleFullscreen() {
        if (document.fullscreenElement) { document.exitFullscreen(); }
        else if (document.documentElement.requestFullscreen) { document.documentElement.requestFullscreen(); }
      }
    </script>
</head>
  <body>
    <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" height="480px" width="640px"></canvas>
    <script type="text/javascript">
      var Module = {
        TOTAL_MEMORY: 268435456,
        errorhandler: null, // arguments: err, url, line. This function must return 'true' if the error is handled, otherwise 'false'
        compatibilitycheck: null,
        backgroundColor: "#222C36",
        splashStyle: "Dark",
        dataUrl: "Release/NG.data",
        codeUrl: "Release/NG.js",
        asmUrl: "Release/NG.asm.js",
        memUrl: "Release/NG.mem",
      };
      console.log("If the file NG.mem returns a 404 error, that is ok!")
    </script>
    <script src="Release/UnityLoader.js"></script>
        <button id="fsBtn" onclick="toggleFullscreen()">&#9974; Fullscreen</button>
</body>
</html>
