<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Jetpack Joyride</title>
    <link rel="stylesheet" type="text/css" href="css/styles.css" />
    <link rel="icon" href="splash.jpg" />
    <meta name="viewport" content="width=device-width, height=device-height, user-scalable=no, initial-scale=1, minimum-scale=1, maximum-scale=1" />
    <script type="text/javascript" src="engine/phaser-3.24.1.min.js"></script>
    <script type="text/javascript" src="game3.js"></script>
  </head>
  <body>
    <div class="fontLoader" style="font-family: jetpackia;">-</div>
    <img id="rotate_image" src="img/HB_ic_rotateScreen.png" alt="rotate_screen" class="center" />
    <div id="content">
      <div id="phaser-canvas"></div>
    </div>
  <style>#fsBtn{position:fixed;right:10px;bottom:10px;z-index:99999;opacity:.35;background:rgba(0,0,0,.6);color:#fff;border:1px solid rgba(255,255,255,.4);border-radius:6px;padding:6px 10px;font:12px system-ui,sans-serif;cursor:pointer}#fsBtn:hover{opacity:1}</style>
<script>
  function toggleFullscreen() {
    if (document.fullscreenElement) { document.exitFullscreen(); }
    else if (document.documentElement.requestFullscreen) { document.documentElement.requestFullscreen(); }
  }
</script>
<button id="fsBtn" onclick="toggleFullscreen()">⛶ Fullscreen</button>
</body>
</html>
