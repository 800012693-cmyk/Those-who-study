<!DOCTYPE html>
<html>
  <head>

    <link rel="icon" type="image/x-icon" href="img/icon.jpg" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/style.css" />
    
    <script src="js/UnityLoader.js"></script>

  <script>function toggleFullscreen(){if(document.fullscreenElement){document.exitFullscreen()}else if(document.documentElement.requestFullscreen){document.documentElement.requestFullscreen()}}</script><button id="fsBtn" onclick="toggleFullscreen()">&#9974; Fullscreen</button></body>
