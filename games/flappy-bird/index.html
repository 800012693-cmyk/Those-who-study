<!DOCTYPE html>
<html>
  <head>
    <style>
      #fsBtn {
        position: fixed; right: 10px; bottom: 10px; z-index: 99999; opacity: .35;
        background: rgba(0,0,0,.6); color: #fff; border: 1px solid rgba(255,255,255,.4);
        border-radius: 6px; padding: 6px 10px; font: 12px system-ui, sans-serif; cursor: pointer;
      }
      #fsBtn:hover { opacity: 1; }
    </style>
    <script>
      function toggleFullscreen() {
        if (document.fullscreenElement) { document.exitFullscreen(); }
        else if (document.documentElement.requestFullscreen) { document.documentElement.requestFullscreen(); }
      }
    </script>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta charset="utf-8" />
    <link rel="stylesheet" type="text/css" href="styles.css" />
    <link rel="manifest" href="manifest.json" />
    <style></style>
    <title>Flappy Bird</title>
    <script src="playcanvas-stable.min.js"></script>
    <script src="settings.js"></script>
    </head>
  <body>
    <script src="start.js"></script>
    <script src="loading.js"></script>
  <button id="fsBtn" onclick="toggleFullscreen()">⛶ Fullscreen</button>
</body>
</html>
