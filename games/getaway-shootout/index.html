<!DOCTYPE html>
<html lang="en-us">
  <head>
    <link rel="icon" type="image/x-icon" href="img/images.jpg" />
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Getaway Shootout</title>
    <script src="Build/UnityLoader.js"></script>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
      #gameContainer { width: 100vw; height: 100vh; }
      #gameContainer canvas { display: block; }
      #fsBtn {
        position: fixed; right: 10px; bottom: 10px; z-index: 10; opacity: .35;
        background: rgba(0,0,0,.6); color: #fff; border: 1px solid rgba(255,255,255,.4);
        border-radius: 6px; padding: 6px 10px; font: 12px system-ui, sans-serif; cursor: pointer;
      }
      #fsBtn:hover { opacity: 1; }
    </style>
    <script>
      var gameInstance = UnityLoader.instantiate("gameContainer", "GetawayShootout.json", {});
      function toggleFullscreen() {
        if (document.fullscreenElement) { document.exitFullscreen(); }
        else if (document.documentElement.requestFullscreen) { document.documentElement.requestFullscreen(); }
      }
    </script>
  </head>
  <body>
    <div id="gameContainer"></div>
    <button id="fsBtn" onclick="toggleFullscreen()">&#9974; Fullscreen</button>
  </body>
</html>
