<!DOCTYPE html>
<html>
<head>
  <title>My Game Site</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #1a1a2e;
      color: white;
      text-align: center;
      padding-top: 60px;
    }
    h1 { font-size: 48px; }
    .btn {
      display: block;
      width: 320px;
      margin: 15px auto;
      padding: 20px;
      font-size: 24px;
      background: #e94560;
      color: white;
      text-decoration: none;
      border-radius: 12px;
    }
    .btn:hover { background: #ff2e63; }
  </style>
</head>
<body>
  <h1>🎮 My Game Site</h1>
  <div id="games"></div>

  <!-- Backup button: only shows if auto-detect fails -->
  <a class="btn" href="drive-mad.htm" id="backup" style="display:none">▶ Play Drive Mad</a>

  <script>
    const repo = "800012693-cmyk/Those-who-study";

    function prettyName(file) {
      return file
        .replace(/\.html?$/i, "")
        .replace(/[-_]/g, " ")
        .replace(/\b\w/g, c => c.toUpperCase());
    }

    fetch("https://api.github.com/repos/" + repo + "/contents/")
      .then(r => r.json())
      .then(files => {
        const games = files.filter(f =>
          f.type === "file" &&
          /\.html?$/i.test(f.name) &&
          f.name.toLowerCase() !== "index.html"
        );
        if (!games.length) throw new Error("no games");
        const box = document.getElementById("games");
        games.forEach(f => {
          const a = document.createElement("a");
          a.className = "btn";
          a.href = f.name;
          a.textContent = "▶ Play " + prettyName(f.name);
          box.appendChild(a);
        });
      })
      .catch(() => {
        document.getElementById("backup").style.display = "block";
      });
  </script>
</body>
</html>
